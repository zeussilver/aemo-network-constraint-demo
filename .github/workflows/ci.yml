name: CI

on:
  # Every branch push runs CI; pull requests into main run it against the merge result.
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python pipeline (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: ops_console_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ops" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://ops:ci_only@localhost:5432/ops_console_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply the console's Prisma migrations (the ops tables the ingest job writes)
        run: |
          for f in console/prisma/migrations/*/migration.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - run: python -m pytest -q

  console:
    name: Console (lint, types, Vitest, build, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: console
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: ops_console
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ops" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ops:ci_only@localhost:5432/ops_console
      TEST_DATABASE_URL: postgresql://ops:ci_only@localhost:5432/ops_console_test
      E2E_DATABASE_URL: postgresql://ops:ci_only@localhost:5432/ops_console_e2e
      BETTER_AUTH_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_VIEWER_EMAIL: viewer@example.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Create test databases
        run: |
          psql postgresql://ops:ci_only@localhost:5432/ops_console -c "CREATE DATABASE ops_console_test" -c "CREATE DATABASE ops_console_e2e"
      - name: Generate throwaway secrets for this run
        run: |
          for name in BETTER_AUTH_SECRET SEED_ADMIN_PASSWORD SEED_VIEWER_PASSWORD; do
            value="$(openssl rand -base64 33 | tr -d '/+=')"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: console/playwright-report
          retention-days: 7
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  brand-guard:
    name: No third-party company names in the console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Search console sources
        run: |
          if grep -RniwE "proa" console --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=generated; then
            echo "::error::A third-party company name appears in console/. The console must stay unbranded."
            exit 1
          fi
          echo "Brand guard clean."
