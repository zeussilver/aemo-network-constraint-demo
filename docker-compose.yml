# Local Postgres for the ops console and the ops ingest job. Bound to localhost only;
# the credentials below are local development values, never used on Azure.
name: aemo-ops-console

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops_local_only
      POSTGRES_DB: ops_console
    ports:
      - "127.0.0.1:55460:5432"
    volumes:
      - ops-console-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops_console"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  ops-console-pg:
